name: Sreality Daily Agent 

on:
  schedule:
    - cron: '0 7 * * *'  # כל יום בשעה 9:00 שעון פראג (UTC+2)
  workflow_dispatch:       # אפשרות להרצה ידנית מ-GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore seen IDs cache
        uses: actions/cache@v4
        with:
          path: seen_ids.json
          key: seen-ids-${{ github.run_id }}
          restore-keys: seen-ids-

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python agent.py

      - name: Save seen IDs
        uses: actions/upload-artifact@v4
        with:
          name: seen-ids
          path: seen_ids.json
          retention-days: 90
